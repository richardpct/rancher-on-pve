applicationsets:
  cilium-l2:
    goTemplate: true
    goTemplateOptions: ["missingkey=error"]

    generators:
      - merge:
          mergeKeys:
            - name
          generators:
            - clusters:
                selector:
                  matchLabels:
                    env: downstream
            - list:
                elements:
                  - name: andromeda
                    start_cilium_vip: "192.168.1.101"
                    stop_cilium_vip: "192.168.1.109"
                  - name: phoenix
                    start_cilium_vip: "192.168.1.111"
                    stop_cilium_vip: "192.168.1.119"

    template:
      metadata:
        name: 'cilium-l2-{{ .name }}'
      spec:
        project: default
        source:
          repoURL: 'https://github.com/richardpct/helm-example.git'
          targetRevision: HEAD
          path: cilium-l2
          helm:
            values: |-
              start_cilium_vip: "{{ .start_cilium_vip }}"
              stop_cilium_vip: "{{ .stop_cilium_vip }}"
        destination:
          name: '{{ .name }}'
          namespace: web-apps
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true

  multi-cluster-web:
    namespace: argocd

    goTemplate: true
    goTemplateOptions: ["missingkey=error"]

    generators:
      - merge:
          mergeKeys:
            - name
          generators:
            - clusters:
                selector:
                  matchLabels:
                    env: downstream
            - list:
                elements:
                  - name: andromeda
                    message: "Welcome to the PRODUCTION cluster: Andromeda 🚀"
                    vip: "192.168.1.101"
                    replicas: 3
                  - name: phoenix
                    message: "Welcome to the STAGING cluster: Phoenix 🔥"
                    vip: "192.168.1.111"
                    replicas: 1

    template:
      metadata:
        name: 'simple-web-{{ .name }}'
      spec:
        project: default
        source:
          repoURL: 'https://github.com/richardpct/helm-example.git'
          targetRevision: HEAD
          path: web
          helm:
            values: |-
              message: "{{ .message }}"
              vip: "{{ .vip }}"
              replicaCount: {{ .replicas }}
        destination:
          name: '{{ .name }}'
          namespace: web-apps
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true
