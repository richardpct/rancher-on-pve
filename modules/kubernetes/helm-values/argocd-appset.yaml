applicationsets:
  multi-cluster-web:
    namespace: argocd

    goTemplate: true
    goTemplateOptions: ["missingkey=error"]

    generators:
      - merge:
          mergeKeys:
            - name
          generators:
            - clusters:
                selector:
                  matchLabels:
                    env: downstream
            - list:
                elements:
                  - name: andromeda
                    message: "Welcome to the PRODUCTION cluster: Andromeda 🚀"
                    replicas: 3
                  - name: phoenix
                    message: "Welcome to the STAGING cluster: Phoenix 🔥"
                    replicas: 1

    template:
      metadata:
        name: 'simple-web-{{ .name }}'
      spec:
        project: default
        source:
          repoURL: 'https://github.com/richardpct/helm-example.git'
          targetRevision: HEAD
          path: .
          helm:
            values: |-
              message: "{{ .message }}"
              replicaCount: {{ .replicas }}
        destination:
          name: '{{ .name }}'
          namespace: web-apps
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true
